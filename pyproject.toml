[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "cockpit"
version = "0.1.0"
description = "Forge/orchestrateur local : projet → roadmap (features + tasks DAG) → dispatch worker claude en worktree → gate → merge. Spine CLI + daemon FastAPI, édition lightweight WSL (zéro Proxmox/GPU/CT)."
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [{ name = "AvAgency", email = "contact@avagency.pro" }]
keywords = ["orchestrator", "forge", "worktree", "dispatch", "fastapi", "cli"]
# Comme mcp-catalogs (et contrairement à code-map stdlib-pur), le cockpit EST un service : il porte de
# vraies dépendances runtime. fastapi+uvicorn (daemon + web/PTY), PyYAML (roadmap.yaml in-repo). Le socle
# (config/core/db) reste stdlib-pur ; ces imports sont PARESSEUX (le package s'importe sans le serveur).
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "pyyaml>=6.0",
  # secret store par défaut (EncryptedFileStore) : chiffrement authentifié au repos (Fernet). Import PARESSEUX
  # dans secrets/file_store.py — le socle reste stdlib-pur, la dép n'est tirée qu'à l'usage du store fichier.
  "cryptography>=42",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.5", "mypy>=1.10", "httpx>=0.27", "types-PyYAML"]
# adaptateur BWS (secret store OPTIONNEL) : SDK officiel Bitwarden (cœur Rust, crypto E2E). Non tiré par le
# défaut file store ; installer `cockpit[bws]` pour l'activer. Import PARESSEUX dans secrets/bws_store.py.
bws = ["bitwarden-sdk>=1.0"]

[project.scripts]
# Une porte unifiée : project / roadmap / task / dispatch / gate / merge / serve.
cockpit = "cockpit.cli:main"

[project.urls]
Repository = "https://github.com/Avadis7860/cockpit"

[tool.hatch.build.targets.wheel]
packages = ["src/cockpit"]

# Distribution turnkey : embarque la SPA buildée (web/dist) sous cockpit/_web_dist dans le wheel — l'utilisateur
# final n'installe que Python, l'UI voyage dans le wheel. Le front se build via `npm run build`/`cockpit setup`
# AVANT de packager (le hook ne lance pas npm — cf. hatch_build.py). Sobre/non bloquant.
[tool.hatch.build.targets.wheel.hooks.custom]
path = "hatch_build.py"

[tool.ruff]
line-length = 110
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.flake8-bugbear]
# `Depends`/`Query`/… en défaut d'argument est l'idiome FastAPI (résolus par requête, jamais mutés) — B008
# ne s'y applique pas. On les déclare immuables plutôt que d'éparpiller des `# noqa`.
extend-immutable-calls = ["fastapi.Depends", "fastapi.Query", "fastapi.Path", "fastapi.Body"]

[tool.mypy]
python_version = "3.11"
packages = ["cockpit"]
mypy_path = "src"
ignore_missing_imports = true  # fastapi / uvicorn : typage lâche des dépendances serveur (imports paresseux)

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
# Les fixtures sont des mini-arborescences d'échantillon — jamais des tests à collecter.
norecursedirs = ["fixtures"]

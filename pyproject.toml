[build-system]
requires = ["hatchling>=1.27"]  # PEP 639 : <1.27 dégrade en silence (metadata 2.3, NOTICE non embarqué)
build-backend = "hatchling.build"

[project]
name = "cockpit"
version = "0.1.0"
description = "Forge/orchestrateur local : projet → roadmap (features + tasks DAG) → dispatch worker claude en worktree → gate → merge. Spine CLI + daemon FastAPI, édition lightweight WSL (zéro Proxmox/GPU/CT)."
readme = "README.md"
requires-python = ">=3.11"
license = "AGPL-3.0-or-later"
license-files = ["LICENSE", "NOTICE", "LICENSES/*.txt"]
authors = [{ name = "AvAgency", email = "contact@avagency.pro" }]
keywords = ["orchestrator", "forge", "worktree", "dispatch", "fastapi", "cli"]
# Comme mcp-catalogs (et contrairement à code-map stdlib-pur), le cockpit EST un service : il porte de
# vraies dépendances runtime. fastapi+uvicorn (daemon + web/PTY), PyYAML (roadmap.yaml in-repo). Le socle
# (config/core/db) reste stdlib-pur ; ces imports sont PARESSEUX (le package s'importe sans le serveur).
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "pyyaml>=6.0",
  # secret store par défaut (EncryptedFileStore) : chiffrement authentifié au repos (Fernet). Import PARESSEUX
  # dans secrets/file_store.py — le socle reste stdlib-pur, la dép n'est tirée qu'à l'usage du store fichier.
  "cryptography>=42",
  # moteur de séquencement des tasks (DAG, classification, eff_prio) : `roadmap/resolver.py` importe
  # `taskmap.core`. VENDORÉ dans le wheel (comme `codemap`) par deploy/build-wheel.sh depuis le sibling
  # ../task-map (SoT épinglé au SHA 85bd32e) → wheel AUTO-CONTENU, plus de dép git privée à cloner au
  # pip-install sur un hôte frais. Volontairement PAS dans project.dependencies (embarqué au build) ; en
  # dev : `pip install -e ../task-map`.
  # client MCP runtime (`mcp/client.py`) : résout un `blueprint:` en direct via `mcp-catalogs`. Même plancher
  # que le serveur (≥3.2.0 pour CVE-2026-32871). Import PARESSEUX (tiré à l'appel, socle non alourdi).
  "fastmcp>=3.3.1",
  # parseur multipart/form-data : requis par FastAPI pour un endpoint `UploadFile`/`Form` (1ᵉʳ du repo, route
  # `POST /api/projects/{slug}/upload` du canal content). FastAPI le charge à la définition de la route → dép
  # RUNTIME (pas paresseuse) dès que le daemon monte le router projects. Le socle CLI/core reste stdlib-pur.
  "python-multipart>=0.0.9",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.5", "mypy>=1.10", "httpx>=0.27", "types-PyYAML"]
# adaptateur BWS (secret store OPTIONNEL) : SDK officiel Bitwarden (cœur Rust, crypto E2E). Non tiré par le
# défaut file store ; installer `cockpit[bws]` pour l'activer. Import PARESSEUX dans secrets/bws_store.py.
bws = ["bitwarden-sdk>=1.0"]

[project.scripts]
# Une porte unifiée : project / roadmap / task / dispatch / gate / merge / serve.
cockpit = "cockpit.cli:main"

[project.urls]
Repository = "https://github.com/Avadis7860/cockpit"

[tool.hatch.build.targets.wheel]
packages = ["src/cockpit"]

# Distribution turnkey : embarque la SPA buildée (web/dist) sous cockpit/_web_dist dans le wheel — l'utilisateur
# final n'installe que Python, l'UI voyage dans le wheel. Le front se build via `npm run build`/`cockpit setup`
# AVANT de packager (le hook ne lance pas npm — cf. hatch_build.py). Sobre/non bloquant.
[tool.hatch.build.targets.wheel.hooks.custom]
path = "hatch_build.py"

[tool.ruff]
line-length = 110
target-version = "py311"
src = ["src", "tests"]
# Les bundles de payload sont des TEMPLATES (leur propre `pyproject.toml` + config), pas du code cockpit :
# ruff ne doit pas y descendre (sinon il les lint sous une autre config ET y crée un `.ruff_cache` binaire
# qui casse la lecture UTF-8 du payload). Leur qualité est prouvée par le seed lui-même + le garde-fou toolchain.
extend-exclude = ["src/cockpit/provision/bundles"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.flake8-bugbear]
# `Depends`/`Query`/… en défaut d'argument est l'idiome FastAPI (résolus par requête, jamais mutés) — B008
# ne s'y applique pas. On les déclare immuables plutôt que d'éparpiller des `# noqa`.
extend-immutable-calls = ["fastapi.Depends", "fastapi.Query", "fastapi.Path", "fastapi.Body",
                          "fastapi.File", "fastapi.Form"]

[tool.mypy]
python_version = "3.11"
packages = ["cockpit"]
mypy_path = "src"
ignore_missing_imports = true  # fastapi / uvicorn : typage lâche des dépendances serveur (imports paresseux)

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
# Les fixtures sont des mini-arborescences d'échantillon — jamais des tests à collecter.
norecursedirs = ["fixtures"]

# bootstrap.yaml — ÉDITION MAINTAINER du forgemaster : les 5 outils du framework, adoptés au 1er démarrage.
#
# AUCUN secret ici (c'est de la DONNÉE, versionnée). Les dépôts sont PRIVÉS aujourd'hui → un token de
# LECTURE partagé se pose à l'install via `forgemaster bootstrap --token-file <fichier>` (ou au wizard /setup) ;
# il vit dans le coffre, jamais dans ce fichier ni dans un repo. Un seul PAT fine-grained (Contents:Read sur
# les 5 dépôts) suffit. À la PUBLICATION de ces dépôts (repos publics), le clone devient anonyme et le token
# devient inutile — AUCUN changement de ce fichier ni du code (forward-compatible, D7).
#
# Chaque entrée : slug (kebab-case), source_url (URL git clonée comme SoT réel), kind=tool (→ rail « Outils »).
# `credential_ref` par entrée = OPTIONNEL (référence opaque au coffre pour un token dédié à ce repo) ; absent
# → repli sur le token partagé de --token-file, sinon clone anonyme (repo public).
tools:
  - slug: forgemaster
    source_url: https://github.com/Avadis7860/forgemaster.git
  - slug: code-map
    source_url: https://github.com/Avadis7860/code-map.git
  - slug: front-map
    source_url: https://github.com/Avadis7860/front-map.git
  - slug: docs-map
    source_url: https://github.com/Avadis7860/docs-map.git
  - slug: forgemaster-catalogs
    source_url: https://github.com/Avadis7860/forgemaster-catalogs.git

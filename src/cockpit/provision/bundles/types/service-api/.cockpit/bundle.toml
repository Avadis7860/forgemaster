[bundle]
version = "1"
project_type = "service-api"
facets = ["backend", "doc"]
default_facet = "backend"
archetype = "service"       # gate de profondeur : axes d'un service HTTP (cf. depth-axes.yaml)

# reseed_owned — le contrat de RUN + QUALITÉ possédé par le cockpit, re-matérialisable dans un projet EXISTANT
# par `cockpit scaffold reseed`. Invariant unique : le worker ne les édite JAMAIS → sûrs à réécrire depuis le
# bundle. Un overlay surcharge `bundle.toml` en whole-file → chaque type porte SA liste.
#   • contrat de RUN — `compose.yaml` (contrat de port injecté, aucun nom de projet en dur) + `.dockerignore`.
#   • contrat de QUALITÉ — la DISCIPLINE de la facette `backend` de CET overlay (`METHOD.md`), lue et suivie.
# **Le `Dockerfile` est volontairement EXCLU** (même raison que front-ts) : ici il n'est pas un contrat stable
# mais un STUB soudé à son entrypoint (`COPY . .` + `CMD ["python", "app.py"]`, son propre en-tête dit
# « remplace `app.py` par ton vrai service (FastAPI, etc.) »). Un vrai service impose d'y changer la commande
# (uvicorn) et l'install des dépendances : le posséder écraserait le déploiement réel du worker au prochain
# reseed. Ce qui reste stable, c'est le contrat de port, et il vit dans `compose.yaml`.
# Aussi PAS owned : `pyproject.toml` (dépendances du worker), `app.py` (son code),
# `PERSONA.md`/`settings.local.json`, et les facettes de la BASE (décision base-wide, pas par-type).
reseed_owned = [
  "compose.yaml", ".dockerignore",
  ".claude/facets/backend/METHOD.md",
]

# Déclaration MCP sèche (sans secret ni endpoint). `corpus = true` = ce type bénéficie du capital-token servi.
# Un overlay surcharge `bundle.toml` en whole-file → sans ce bloc, le `corpus = true` de la base est PERDU.
# Silos tech pertinents (fastapi·pydantic·starlette·uvicorn·sqlalchemy·alembic·httpx·pytest·mypy·ruff·anyio·
# hypothesis) : nommés dans la prose du `CLAUDE.md §4`.
[bundle.mcp]
corpus = true

# gate DÉCLARÉE — couvre le RÉSIDU que les routes connues du Tier-0 ne prennent pas : contrat de RUN
# (Dockerfile/compose.yaml/.dockerignore) et entrées de toolchain (pyproject.toml). Sans ce bloc, un diff qui
# ne touche QUE ces fichiers sortirait en ROUGE « toolchain non déclarée » (fail-closed voulu, cf.
# docs/specs/tier0-native-toolchain-gate.md §Amendement). Un overlay surcharge bundle.toml en whole-file →
# le bloc de la base ne serait PAS hérité : chaque type porte le sien.
# Ce sont les MÊMES steps que la route `backend` : dédupliqués (name+cmd+cwd) → joués une seule fois.
# `mypy` est VOLONTAIREMENT absent : sa cible dépend du LAYOUT (la route calcule `src` si le dossier existe,
# sinon `.`) — une déclaration statique divergerait dès que le projet grandit un `src/`, cassant la dédup
# (mypy joué deux fois) et faisant échouer `mypy .` en duplicate-module. La route reste propriétaire de mypy
# et se déclenche sur tout `*.py` touché ; un diff sans Python n'a de toute façon aucun type à revérifier.
[bundle.gate]
steps = [
  { name = "ruff",   argv = ["ruff", "check", "."] },
  { name = "pytest", argv = ["pytest", "-q"] },
]

# pyproject.toml — manifeste du package outil/CLI (semé par le cockpit). Rend le projet **montable** par la
# gate Tier-0 backend (`ruff` → `mypy` → `pytest`) dès sa création — sinon tout `*.py` touché échoue
# « toolchain non montable ». Ajoute tes dépendances + un `[project.scripts]` (entrée CLI) au fil des features.
[project]
name = "tool"
version = "0.1.0"
description = "Outil / bibliothèque CLI semé par le cockpit (remplace au fil des features)."
requires-python = ">=3.11"
dependencies = []

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.11"
check_untyped_defs = true
warn_unused_ignores = true
ignore_missing_imports = true

[tool.pytest.ini_options]
addopts = "-q"

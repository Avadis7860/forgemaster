[bundle]
version = "1"
project_type = "cli-tool"
facets = ["tool", "doc"]
default_facet = "tool"
archetype = "tool"          # gate de profondeur : axes d'un outil CLI (cf. depth-axes.yaml)

# Déclaration MCP sèche (sans secret ni endpoint). `corpus = true` = ce type bénéficie du capital-token servi.
# Un overlay surcharge `bundle.toml` en whole-file → sans ce bloc, le `corpus = true` de la base est PERDU.
# Les silos tech pertinents (typer·rich·httpx·pytest·mypy·ruff) vivent dans la prose du `CLAUDE.md §4`.
[bundle.mcp]
corpus = true

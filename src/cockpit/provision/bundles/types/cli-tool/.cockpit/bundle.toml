[bundle]
version = "1"
project_type = "cli-tool"
facets = ["tool", "doc"]
default_facet = "tool"
archetype = "tool"          # gate de profondeur : axes d'un outil CLI (cf. depth-axes.yaml)

# reseed_owned — le contrat de QUALITÉ possédé par le cockpit, re-matérialisable dans un projet EXISTANT par
# `cockpit scaffold reseed`. Invariant unique : le worker ne l'édite JAMAIS → sûr à réécrire depuis le bundle.
# Un overlay surcharge `bundle.toml` en whole-file → chaque type porte SA liste.
# **Aucun contrat de RUN ici, et c'est exact** : un outil CLI ne se sert pas (ni Dockerfile ni compose.yaml
# dans cet overlay). La liste est courte parce que la surface possédée l'est — pas par omission.
# Volontairement PAS owned : `pyproject.toml` (le worker y ajoute ses dépendances et ses entry-points),
# `PERSONA.md`/`settings.local.json`, et les facettes de la BASE (`doc`… — décision base-wide, pas par-type).
reseed_owned = [
  ".claude/facets/tool/METHOD.md",
]

# Déclaration MCP sèche (sans secret ni endpoint). `corpus = true` = ce type bénéficie du capital-token servi.
# Un overlay surcharge `bundle.toml` en whole-file → sans ce bloc, le `corpus = true` de la base est PERDU.
# Les silos tech pertinents (typer·rich·httpx·pytest·mypy·ruff) vivent dans la prose du `CLAUDE.md §4`.
[bundle.mcp]
corpus = true

# gate DÉCLARÉE — couvre le RÉSIDU hors routes connues du Tier-0 (entrées de toolchain : pyproject.toml).
# Sans ce bloc, un diff qui ne touche QUE ces fichiers sortirait en ROUGE « toolchain non déclarée »
# (fail-closed voulu, cf. docs/specs/tier0-native-toolchain-gate.md §Amendement). Un overlay surcharge
# bundle.toml en whole-file → le bloc de la base ne serait PAS hérité : chaque type porte le sien.
# Mêmes steps que la route `backend` : dédupliqués (name+cmd+cwd) → joués une seule fois.
# `mypy` est VOLONTAIREMENT absent : sa cible dépend du LAYOUT (la route calcule `src` si le dossier existe,
# sinon `.`) — une déclaration statique divergerait dès que le projet grandit un `src/`, cassant la dédup
# (mypy joué deux fois) et faisant échouer `mypy .` en duplicate-module. La route reste propriétaire de mypy
# et se déclenche sur tout `*.py` touché ; un diff sans Python n'a de toute façon aucun type à revérifier.
[bundle.gate]
steps = [
  { name = "ruff",   argv = ["ruff", "check", "."] },
  { name = "pytest", argv = ["pytest", "-q"] },
]

# .codemap.toml — carte de code d'un projet browser-game (univers TypeScript unifié : front web/ + serveur server/).
# Override de la base : l'engine est ÉPINGLÉ à "ts" (et non "auto") pour que la carte soit correcte dès
# l'amorçage — sur un repo encore vide, l'auto-détection ne trouverait aucune extension et rendrait une
# carte vide. Le reste = défauts code-map. Câblage par référence : ceci CONFIGURE code-map, ne le recode pas.

[perimeter]
include = []            # racine entière (front web/ + serveur server/)
exclude = []            # défauts : .git .venv node_modules __pycache__ dist build

[engines]
select = "ts"           # univers TS unifié (React/Vite front, Hono/Drizzle serveur) — épinglé, pas d'auto

[subsystem]
strategy = "top-segment"  # 1er segment de chemin = sous-système
split = ["web", "server"]  # éclate front (web/) et back (server/) en sous-systèmes distincts

[wiring]
sources = []            # pas de câblage non-import au départ

[git]
last_commit = false     # multi-OS sûr (pas de dépendance git dans la carte)

[bundle]
version = "1"
project_type = "browser-game"
facets = ["frontend", "backend", "game-design", "doc"]
default_facet = "backend"
archetype = "game"          # gate de profondeur : axes du genre jeu (cf. depth-axes.yaml)

# reseed_owned — le contrat de RUN + QUALITÉ possédé par le cockpit, re-matérialisable dans un projet EXISTANT
# par `cockpit scaffold reseed`. Invariant unique : le worker ne les édite JAMAIS → sûrs à réécrire depuis le
# bundle. Un overlay surcharge `bundle.toml` en whole-file → chaque type porte SA liste.
#   • contrat de RUN — le `Dockerfile` EST owned ici (contrairement à front-ts/service-api) : il est générique
#     et stable (`npm ci && npm run build`, `npx tsx server/prod.ts`) ; le jeu réel remplit `web/` + `server/`
#     au fil des features, jamais le Dockerfile. `compose.yaml` + `.dockerignore` : contrat mono-port injecté.
#   • contrat de QUALITÉ — la DISCIPLINE des facettes de CET overlay (`METHOD.md`), que le worker LIT et suit.
#     Les facettes de la BASE (`doc`…) ne sont pas déclarées ici : les posséder depuis 5 manifestes serait la
#     duplication qui dérive — c'est une décision base-wide, pas par-type.
# Volontairement PAS owned : `package.json`/`tsconfig.json`/`vite.config.ts` (toolchain que le worker fait
# grandir), `server/*.ts` + `web/*` (le jeu), les GARDES semées (`src/**/*.test.ts` — la garde d'un worker est
# plus riche, l'écraser retirerait de la couverture), `PERSONA.md`/`settings.local.json`.
reseed_owned = [
  "Dockerfile", "compose.yaml", ".dockerignore",
  ".claude/facets/backend/METHOD.md", ".claude/facets/frontend/METHOD.md",
  ".claude/facets/game-design/METHOD.md",
]

# Déclaration MCP sèche (sans secret ni endpoint — ceux-là vivent au niveau instance). `corpus = true` =
# ce type bénéficie du capital-token servi (blueprint/templates/tech). Les silos tech pertinents sont nommés
# dans la prose du `CLAUDE.md §4` (le lever réellement lu par le worker), SoT unique — pas ici (un champ TOML
# non consommé qui dupliquerait §4 dériverait en silence).
[bundle.mcp]
corpus = true

# gate DÉCLARÉE — couvre le RÉSIDU hors routes connues du Tier-0 : contrat de RUN (Dockerfile/compose.yaml/
# .dockerignore) et entrées de toolchain (package.json/tsconfig.json/vite.config/.codemap.toml). Sans ce bloc,
# un diff qui ne touche QUE ces fichiers sortirait en ROUGE « toolchain non déclarée » (fail-closed voulu, cf.
# docs/specs/tier0-native-toolchain-gate.md §Amendement). Un overlay surcharge bundle.toml en whole-file →
# le bloc de la base ne serait PAS hérité : chaque type porte le sien.
# Même step que la route `front`/`backend-node` (package.json RACINE, univers TS unifié) : dédupliqué.
[bundle.gate]
steps = [
  { name = "npm-run-gate", argv = ["npm", "run", "gate"] },
]

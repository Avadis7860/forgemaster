[bundle]
version = "1"
project_type = "browser-game"
facets = ["frontend", "backend", "game-design", "doc"]
default_facet = "backend"

# Déclaration MCP sèche (sans secret). `corpus` = bénéficie du capital-token universel ; `tech_scope` =
# silo tech dédié à ce type → un worker interroge `query(type=tech, scope=browser-game)` (cf. CLAUDE.md).
[bundle.mcp]
corpus = true
tech_scope = "browser-game"

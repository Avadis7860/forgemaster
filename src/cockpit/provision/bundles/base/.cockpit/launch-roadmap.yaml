# SoT: templates:cockpit-launch-pipeline/launch-roadmap (mcp-catalogs-data) — DÉRIVÉ, ne pas diverger.
# Drift-checké (provision.check_launch_roadmap_drift, `cockpit bundle validate`) contre le mirror vendoré
# provision/launch_templates/generic.yaml. Distille au CENTRE puis re-dérive ; cf. décision vault
# corpus/decision/meta/2026-07-21--launch-roadmap-sot-and-derive-lifecycle.md.
# launch-roadmap.yaml — roadmap de LANCEMENT générique, semée dans le board (DB) à la création du projet.
# Schéma = contrat .cockpit/roadmap.yaml SANS la clé `project:` (le slug est fourni au seed).
# Le SOCLE d'amorçage : cadrer l'intention, puis dériver la roadmap de travail via roadmap-decompose.
# Un overlay de type SURCHARGE ce fichier (whole-file) pour son propre amorçage (ex. browser-game).
version: 1
features:
  - slug: socle
    title: "Socle — cadrage & décomposition"
    facet: doc
    tasks:
      - slug: cadrage
        title: "Cadrage : renseigner l'Intention du projet"
        priority: P0
        mode: interactive
        depends_on: []
        acceptance: "docs/architecture.md § « Intention » ne porte plus « À renseigner » : ce que le projet fait, pour qui, et le critère binaire de « fini » du premier jalon sont écrits."
      - slug: decompose
        title: "Dériver la roadmap de travail (skill roadmap-decompose)"
        priority: P0
        depends_on: [cadrage]
        acceptance: "À partir de l'Intention, la roadmap du projet porte ≥1 feature de travail (facette + tasks avec depends_on + acceptance) ; `cockpit roadmap check` reste vert."

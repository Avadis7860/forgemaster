# bundle.toml — manifeste du bundle semé (base ⊕ overlay). Committé, voyage avec le repo.
# Lu au dispatch pour résoudre la facette d'une feature quand `features.facet` est NULL (→ default_facet).
# Un overlay de type SURCHARGE ce fichier (whole-file) pour déclarer ses propres facettes.
# Les facettes de base (doc + code/test/infra/review) sont cross-cutting : leurs dossiers sont hérités par
# TOUT type (composition base ⊕ overlay), donc un projet `generic` peut dispatcher du code/test/infra/review,
# pas seulement de la doc. `default_facet` reste `doc` (défaut conservateur : une feature de code pose
# explicitement `facet = "code"`).
[bundle]
version = "1"
project_type = "generic"
facets = ["doc", "code", "test", "infra", "review"]
default_facet = "doc"
# archetype = famille de livrable pour le gate de profondeur (`roadmap check --depth`, cf. depth-axes.yaml).
# Manifeste sec, hors schéma-contrat figé. `generic` défaut prudent = `doc` (un projet typé le surcharge).
archetype = "doc"

# Déclaration MCP sèche (jamais de secret ni d'endpoint — ceux-là vivent au niveau instance, câblés par
# le wizard/provision). `corpus = true` = universel : toute instance bénéficie du capital-token
# blueprint/templates. Les silos tech pertinents par type vivent dans la prose du `CLAUDE.md §4` (SoT unique,
# le lever réellement lu par le worker) — jamais dupliqués en champ TOML non consommé.
[bundle.mcp]
corpus = true

# [bundle.gate] — toolchain DÉCLARÉE du projet, pour tout ce qu'aucune route connue du Tier-0 ne couvre (ni
# `web/`, ni node hors `web/`, ni `*.py`) : contrat de RUN (Dockerfile/compose/nginx), scripts shell, ou tout
# langage hors Python/TS. Le gate ne cherche pas à RECONNAÎTRE une stack, il exige d'être RENSEIGNÉ — sans ce
# bloc, un diff qui ne touche QUE ce résidu sort en ROUGE honnête (« toolchain non déclarée »), jamais en N/A
# silencieux (cf. docs/specs/tier0-native-toolchain-gate.md §Amendement 2026-07-31).
# `generic` ne présume aucune stack : le bloc est laissé VIDE, à renseigner par le projet (ou par l'interview
# de première session). Un overlay de type SURCHARGE ce fichier en whole-file → chaque type porte le sien.
# [bundle.gate]
# steps = [                                   # ordonnés, arrêt au 1ᵉʳ rouge
#   { name = "gate", argv = ["make", "gate"] },   # `cwd` optionnel, relatif à la racine du worktree
# ]

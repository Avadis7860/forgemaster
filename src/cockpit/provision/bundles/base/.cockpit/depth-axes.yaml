# depth-axes.yaml — catalogue des axes-qualité PAR ARCHÉTYPE de livrable (jeu / outil / service / app / doc).
# Manifeste SEC (hors schéma-contrat figé, cf. docs/schema-contract.md §2c). Vit en `base`, donc HÉRITÉ par
# TOUS les bundle-types (composition base ⊕ overlay whole-file, aucun overlay ne le surcharge) : un seul SoT.
#
# Consommé par `cockpit roadmap check <projet> --depth` (roadmap/check.py : check_depth_axes). Pour l'archétype
# du projet (bundle.toml `archetype`), CHAQUE axe doit être COUVERT — une feature/task le mentionne (un des
# mots-clés matche son slug/titre/acceptance) — OU DIFFÉRÉ explicitement (`.cockpit/deferred-axes.yaml`
# {axe: raison}). Un axe ni couvert ni différé ⇒ issue `UNCOVERED_AXIS` (le drop silencieux est refusé).
#
# Chaque axe = une liste de mots-clés (FR + EN), matchés en minuscules, sous-chaîne. Enrichir un archétype =
# ajouter un axe / des mots-clés ; jamais de prose (la nuance vit dans les skills interview + roadmap-decompose).


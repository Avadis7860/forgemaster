# MIRROR VENDORÉ du template SoT central : templates:browser-game-pve/launch-roadmap (mcp-catalogs-data).
# Ce n'est PAS un fichier semé (il vit hors bundles/) : c'est la copie canonique contre laquelle la graine
# bundle `types/browser-game/.cockpit/launch-roadmap.yaml` est DRIFT-CHECKÉE (provision.check_launch_roadmap_drift,
# pytest + CLI `cockpit bundle validate`). Pour tout changement : distille d'abord le template CENTRAL
# (mcp-catalogs-data), re-vendore ici, puis re-dérive la graine bundle (SoT-and-derive, doctrine capital-jeton).
# Surcharge whole-file du socle générique : design-first (interview → boucle-eco → decompose).
version: 1
features:
  - slug: socle-design
    title: "Socle — design du jeu & décomposition"
    facet: game-design
    tasks:
      - slug: interview
        title: "Interview de conception (première session)"
        priority: P0
        mode: interactive
        depends_on: []
        acceptance: "docs/design.md § « Concept & périmètre jouable » renseigné : le pitch en une phrase + la définition binaire de « jouable » du premier jalon ; plus aucun « (à renseigner) » dans cette section."
      - slug: boucle-eco
        title: "Boucle de jeu & économie"
        priority: P0
        depends_on: [interview]
        acceptance: "docs/design.md §§ « Boucle de jeu » et « Économie & équilibrage » renseignés : la décision répétée du joueur + les ressources/coûts/taux chiffrés ; plus aucun « (à renseigner) » dans ces sections."
      - slug: decompose
        title: "Dériver la roadmap de lancement (skill roadmap-decompose)"
        priority: P0
        depends_on: [boucle-eco]
        acceptance: "Depuis docs/design.md, la roadmap porte les features d'amorçage jouable — scaffold serveur (backend), schémas partagés (backend), premier jalon jouable (frontend) — chacune facette + tasks (depends_on + acceptance) ; `cockpit roadmap check` vert."

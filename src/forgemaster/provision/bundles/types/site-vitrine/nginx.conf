# nginx.conf — sert le site vitrine statique (Astro SSG) sur le port interne 0.0.0.0:8000 (contrat de run
# du forgemaster). Stub d'app du type-service : pas de runtime applicatif, juste du HTML/CSS/JS statique.
server {
    listen 8000;
    listen [::]:8000;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Le port interne 8000 n'est JAMAIS l'autorité publique : le forgemaster publie sur un port
    # dynamique (5250+) et le visiteur atteint le site via l'host/port du forgemaster, pas ce loopback.
    # Sans ceci, un 301 de dossier (`/x` → `/x/`, cascade normale d'Astro SSG multi-pages) émet un
    # `Location: http://127.0.0.1:8000/x/` absolu → le client suit vers :8000 non publié →
    # ERR_CONNECTION_REFUSED. `off` force un `Location: /x/` relatif, résolu contre l'origine réelle.
    # Ne PAS retirer : l'artefact servi ne doit jamais advertise une autorité qu'il ne contrôle pas.
    absolute_redirect off;

    # Assets fingerprintés (Astro) : cache long. Le HTML reste revalidé.
    location /_astro/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Site statique multilingue : essaie le fichier, puis le dossier (index.html), sinon 404.
    location / {
        try_files $uri $uri/ $uri.html =404;
    }

    error_page 404 /404.html;
}
